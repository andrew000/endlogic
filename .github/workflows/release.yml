name: Release

# Run by hand from the Actions tab with a version number, e.g. 0.1.0:
# builds endlogic-win for x64 Windows and publishes it as release v<version>
# on the current commit of master.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.1.0 (the tag is v<version>)
        required: true
        type: string

# Creating a release and its tag needs write access to the contents.
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the version and that its tag is new
        run: |
          if ($env:VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Output "::error::The version must look like 0.1.0, not '$env:VERSION'."
            exit 1
          }
          $tag = "v$env:VERSION"
          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "::error::The tag $tag already exists. Nothing was built or changed; choose another version."
            exit 1
          }
          exit 0

      - name: Check out master
        uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # The same build as `just win-build`: the standard library is rebuilt
      # for size and aborts at once on a panic.
      - name: Build endlogic-win (release)
        env:
          CARGO_PROFILE_RELEASE_PANIC: immediate-abort
        run: cargo build -p endlogic-win --bin endlogic-win --release --target x86_64-pc-windows-msvc --locked '-Zbuild-std=std,panic_abort' -Zpanic-immediate-abort

      - name: Name the program and write its SHA-256
        run: |
          Copy-Item target/x86_64-pc-windows-msvc/release/endlogic-win.exe endlogic-win-x64.exe
          $hash = (Get-FileHash -Algorithm SHA256 endlogic-win-x64.exe).Hash.ToLowerInvariant()
          Set-Content -Path endlogic-win-x64.exe.sha256 -Value "$hash  endlogic-win-x64.exe" -Encoding ascii -NoNewline
          Get-Content endlogic-win-x64.exe.sha256

      - name: Create the release
        run: |
          $commit = git rev-parse HEAD
          $notes = "endlogic-win $env:VERSION for x64 Windows 10 and 11, built from $commit. Check the download against endlogic-win-x64.exe.sha256."
          gh release create "v$env:VERSION" endlogic-win-x64.exe endlogic-win-x64.exe.sha256 --repo "$env:GITHUB_REPOSITORY" --target $commit --title "endlogic $env:VERSION" --notes $notes
