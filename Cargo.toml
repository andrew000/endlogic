[workspace]
resolver = "3"
members = ["crates/endlogic-core", "crates/endlogic-cli", "crates/endlogic-ui", "crates/endlogic-web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
endlogic-core = { path = "crates/endlogic-core" }
endlogic-ui = { path = "crates/endlogic-ui" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
